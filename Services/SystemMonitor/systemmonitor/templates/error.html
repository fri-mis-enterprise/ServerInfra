{% extends 'base.html' %}
{% block title %}Action needs attention{% endblock %}
{% block content %}<div class="panel error-page"><span class="dialog-icon">{{ icon('alert') }}</span><p class="eyebrow">REQUEST {{ error.code }}</p><h1>{{ 'Page not found' if error.code == 404 else 'Action needs attention' }}</h1><p>{{ error.description }}</p><a class="button button-primary" href="{{ url_for('dashboard.index') }}">{{ icon('back') }}Back to dashboard</a></div>{% endblock %}
