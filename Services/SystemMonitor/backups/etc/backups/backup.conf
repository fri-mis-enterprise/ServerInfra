# Global backup settings (/etc/backups/backup.conf)

# Verify every .tar.gz archive with gzip -t / pigz -t before finalizing (1=on, 0=off)
VERIFY_ARCHIVE=1

# Max seconds to wait if another instance of the same job is still running
LOCK_WAIT_SECS=300

# CIFS mount ownership
CIFS_UID=1000
CIFS_GID=1000

# Source mount paths
FAST_SRC="/mnt/fast_system"
SYSTEM3_SRC="/mnt/system3"
SQL_SRC="/mnt/sql_database"
