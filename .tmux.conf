# ============================================================
# General
# ============================================================

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================================
# Prefix
# ============================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ============================================================
# Pane Navigation + Keybinds
# ============================================================

bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind Tab next-window
bind BTab previous-window

bind h display-popup -E -w 60% -h 70% "~/dotfiles/tmux-help; read"

# ============================================================
# Pane Splitting
# ============================================================

bind | split-window -h
bind - split-window -v


# ============================================================
# Window Naming
# ============================================================

setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

# ============================================================
# Status Bar
# ============================================================

set -g status-position bottom
set -g status-interval 5

# Tokyo Night palette
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# Left side
set -g status-left "#[fg=#7aa2f7,bold][#S]#[default] - "
set -g status-left-length 30

# Windows
set -g window-status-format "#[fg=#565f89][#W]#[default] "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] [#W] #[default]"

# Right side
set -g status-right "#[fg=#565f89][#H] %I:%M %p#[default] "
set -g status-right-length 60
